plugins { id 'com.android.application' }

android {
    namespace 'com.amigoesrpg.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amigoesrpg.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
